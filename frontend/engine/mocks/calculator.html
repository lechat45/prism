<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculatrice</title>
<style>
:root{color-scheme:dark;--accent:#7cc4ff;--bg:#0b0d12;--glass:rgba(255,255,255,.06);--glass-2:rgba(255,255,255,.1);--line:rgba(255,255,255,.14);--text:#f4f6fb;--muted:#9aa3b5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--text);display:flex;padding:clamp(10px,3vw,18px);
background:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--accent) 22%,transparent) 0,transparent 55%),radial-gradient(circle at 90% 100%,#3a1d4a 0,transparent 50%),var(--bg)}
.card{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:clamp(12px,3vw,20px);
backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 20px 50px rgba(0,0,0,.45)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.display{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:right}
.history{color:var(--muted);font-size:12px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.expr{color:var(--muted);font-size:12px;min-height:18px}
.value{font-size:clamp(22px,7vmin,36px);font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:8px;min-height:0}
.keys button{min-height:34px;border-radius:12px;border:1px solid var(--line);background:var(--glass-2);font-size:clamp(14px,3vmin,18px);transition:background .15s,transform .1s}
.keys button:hover{background:rgba(255,255,255,.16)}
.keys button:active{transform:scale(.96)}
.keys .op{background:color-mix(in srgb,var(--accent) 20%,transparent);color:color-mix(in srgb,var(--accent) 45%,white)}
.keys .eq{background:var(--accent);color:#0b0d12;font-weight:700;border-color:rgba(255,255,255,.3)}
.keys .wide{grid-column:span 2}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="display" aria-live="polite">
    <div class="history" id="history" title="Dernières opérations"></div>
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys" id="keys">
    <button data-k="C">C</button><button data-k="±">±</button><button data-k="%">%</button><button class="op" data-k="/">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="*">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
    <button class="wide" data-k="0">0</button><button data-k=".">,</button><button class="eq" data-k="=">=</button>
  </div>
</main>
<script>
const valueEl = document.getElementById("value");
const exprEl = document.getElementById("expr");
const historyEl = document.getElementById("history");
const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };
const state = Object.assign(
  { current: "0", stored: null, op: null, fresh: false, history: [] },
  JSON.parse(localStorage.getItem("state") || "null"),
);

const fmt = (n) => (Number.isFinite(n) ? String(Number(n.toPrecision(12))).replace(".", ",") : "Erreur");
function save() {
  localStorage.setItem("state", JSON.stringify(state));
}
function render() {
  valueEl.textContent = state.current.replace(".", ",");
  exprEl.textContent = state.stored !== null && state.op ? fmt(state.stored) + " " + symbols[state.op] : "";
  historyEl.textContent = state.history.join("   ·   ");
}
function compute(a, b, o) {
  if (o === "+") return a + b;
  if (o === "-") return a - b;
  if (o === "*") return a * b;
  if (o === "/") return b === 0 ? NaN : a / b;
  return b;
}
function press(k) {
  if (/^[0-9]$/.test(k)) {
    state.current = state.fresh || state.current === "0" ? k : state.current + k;
    state.fresh = false;
  } else if (k === ".") {
    if (state.fresh) { state.current = "0"; state.fresh = false; }
    if (!state.current.includes(".")) state.current += ".";
  } else if (k in symbols) {
    if (state.op && !state.fresh) state.current = String(compute(state.stored, parseFloat(state.current), state.op));
    state.stored = parseFloat(state.current);
    state.op = k;
    state.fresh = true;
  } else if (k === "=") {
    if (state.op === null) return;
    const result = compute(state.stored, parseFloat(state.current), state.op);
    const line = fmt(state.stored) + " " + symbols[state.op] + " " + fmt(parseFloat(state.current)) + " = " + fmt(result);
    state.history = [line].concat(state.history).slice(0, 4);
    state.current = Number.isFinite(result) ? String(Number(result.toPrecision(12))) : "Erreur";
    state.stored = null;
    state.op = null;
    state.fresh = true;
  } else if (k === "C") {
    Object.assign(state, { current: "0", stored: null, op: null, fresh: false });
  } else if (k === "±") {
    state.current = state.current.startsWith("-") ? state.current.slice(1) : state.current === "0" ? "0" : "-" + state.current;
  } else if (k === "%") {
    state.current = String(parseFloat(state.current) / 100);
  }
  if (state.current === "NaN") state.current = "Erreur";
  save();
  render();
}
document.getElementById("keys").addEventListener("click", (e) => {
  const key = e.target.closest("button");
  if (key) press(key.dataset.k);
});
document.addEventListener("keydown", (e) => {
  const map = { Enter: "=", Escape: "C", ",": "." };
  const k = map[e.key] || e.key;
  if (/^[0-9.+\-*\/=%C]$/.test(k)) { e.preventDefault(); press(k); }
});
render();
</script>
</body>
</html>
