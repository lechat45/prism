<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord</title>
<style>
:root{color-scheme:dark;--accent:#7cc4ff;--bg:#0b0d12;--glass:rgba(255,255,255,.06);--glass-2:rgba(255,255,255,.1);--line:rgba(255,255,255,.14);--text:#f4f6fb;--muted:#9aa3b5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--text);display:flex;padding:clamp(10px,3vw,18px);
background:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--accent) 22%,transparent) 0,transparent 55%),radial-gradient(circle at 90% 100%,#3a1d4a 0,transparent 50%),var(--bg)}
.card{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:clamp(12px,3vw,20px);
backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 20px 50px rgba(0,0,0,.45)}
h1{font-size:17px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0;font-size:12.5px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kpi{background:var(--glass-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.kpi span{display:block;color:var(--muted);font-size:11.5px}
.kpi strong{font-size:clamp(15px,3.2vmin,20px);font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}
.toolbar button{background:var(--glass-2);border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-size:12.5px}
.toolbar button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 24%,transparent);border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.chart{flex:1;min-height:120px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:10px}
svg{width:100%;height:100%;display:block}
.bar{fill:var(--accent);transition:opacity .15s}
.bar:hover{opacity:.75}
.tip{fill:var(--text);font-size:11px;text-anchor:middle}
.axis{fill:var(--muted);font-size:11px;text-anchor:middle}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <header>
    <h1>Tableau de bord</h1>
    <p class="sub">Généré à partir de __PRISM_SOURCE__ · survolez les barres.</p>
  </header>
  <section class="kpis" id="kpis" aria-label="Indicateurs clés"></section>
  <div class="toolbar" role="group" aria-label="Tri">
    <button type="button" data-sort="none">Ordre d'origine</button>
    <button type="button" data-sort="desc">Tri décroissant</button>
  </div>
  <div class="chart"><svg id="chart" viewBox="0 0 700 280" preserveAspectRatio="none" role="img" aria-label="Histogramme"></svg></div>
</main>
<script>
const DATA = /*PRISM_DATA*/[];
const NS = "http://www.w3.org/2000/svg";
const nf = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 });
const state = Object.assign({ sort: "none" }, JSON.parse(localStorage.getItem("state") || "null"));
const values = DATA.map((d) => d.value);
const total = values.reduce((a, b) => a + b, 0);
const kpis = [
  ["Total", total],
  ["Moyenne", total / values.length],
  ["Maximum", Math.max(...values)],
  ["Minimum", Math.min(...values)],
];
document.getElementById("kpis").innerHTML = kpis
  .map(([k, v]) => '<div class="kpi"><span>' + k + "</span><strong>" + nf.format(v) + "</strong></div>")
  .join("");

function el(name, attrs, text) {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}

function draw() {
  const rows = state.sort === "desc" ? [...DATA].sort((a, c) => c.value - a.value) : DATA;
  const svg = document.getElementById("chart");
  svg.replaceChildren();
  const W = 700, H = 280, pad = 30, max = Math.max(...rows.map((r) => r.value), 1);
  const slot = (W - pad * 2) / rows.length, bw = Math.min(56, slot * 0.62);
  rows.forEach((r, i) => {
    const h = Math.max(0, (r.value / max) * (H - pad * 2));
    const x = pad + i * slot + (slot - bw) / 2, y = H - pad - h;
    const bar = el("rect", { class: "bar", x, y, width: bw, height: h, rx: 7 });
    bar.append(el("title", {}, r.label + " : " + nf.format(r.value)));
    svg.append(bar, el("text", { class: "tip", x: x + bw / 2, y: y - 6 }, nf.format(r.value)),
      el("text", { class: "axis", x: x + bw / 2, y: H - pad + 16 }, r.label));
  });
  document.querySelectorAll("[data-sort]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sort === state.sort)));
}

document.querySelectorAll("[data-sort]").forEach((b) => b.addEventListener("click", () => {
  state.sort = b.dataset.sort;
  localStorage.setItem("state", JSON.stringify(state));
  draw();
}));
draw();
</script>
</body>
</html>
