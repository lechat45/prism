<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analyse de texte</title>
<style>
:root{color-scheme:dark;--accent:#7cc4ff;--bg:#0b0d12;--glass:rgba(255,255,255,.06);--glass-2:rgba(255,255,255,.1);--line:rgba(255,255,255,.14);--text:#f4f6fb;--muted:#9aa3b5;--mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--text);display:flex;padding:clamp(8px,2.5vw,16px);
background:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--accent) 22%,transparent) 0,transparent 55%),radial-gradient(circle at 90% 100%,#3a1d4a 0,transparent 50%),var(--bg)}
.card{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:clamp(12px,2.5vw,18px);
backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 20px 50px rgba(0,0,0,.45)}
h1{font-size:16px;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
h2{font-size:12px;margin:0 0 6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted);margin:0;font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stat{background:var(--glass-2);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.stat span{display:block;color:var(--muted);font-size:11px}
.stat strong{font-size:17px;font-variant-numeric:tabular-nums}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
section{min-height:0;display:flex;flex-direction:column}
.top{list-style:none;margin:0;padding:0;overflow:auto}
.top li{display:grid;grid-template-columns:minmax(60px,1fr) 2fr auto;align-items:center;gap:8px;font-size:12.5px;padding:2px 0}
.top .w{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--accent);opacity:.85}
.top .n{color:var(--muted);font-variant-numeric:tabular-nums}
input{font:inherit;color:inherit;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:6px}
input:focus{outline:none;border-color:var(--accent)}
.lines{flex:1;min-height:60px;overflow:auto;font:12px/1.6 var(--mono);background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:6px 0}
.line{display:grid;grid-template-columns:3.5em 1fr;gap:10px;padding:0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.line b{color:var(--muted);font-weight:400;text-align:right;user-select:none}
mark{background:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--text);border-radius:3px}
.empty{color:var(--muted);margin:auto;text-align:center}
</style>
</head>
<body>
<main class="card" id="app">
  <header>
    <h1 id="title">Analyse de texte</h1>
    <p class="sub" id="meta"></p>
  </header>
  <section class="stats" id="stats" aria-label="Statistiques"></section>
  <div class="cols">
    <section aria-labelledby="top-title">
      <h2 id="top-title">Mots fréquents</h2>
      <ol class="top" id="top"></ol>
    </section>
    <section aria-labelledby="read-title">
      <h2 id="read-title">Lecture</h2>
      <input id="q" type="search" placeholder="Rechercher dans le texte…" aria-label="Rechercher dans le texte">
      <div class="lines" id="lines" aria-live="polite"></div>
    </section>
  </div>
</main>
<script>
const FILE = window.PRISM_FILE;
const $ = (id) => document.getElementById(id);
const nf = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1 });
const state = Object.assign({ q: "" }, JSON.parse(localStorage.getItem("state") || "null"));
const STOP = new Set(("le la les un une des du de et en au aux ce ces cet cette que qui quoi dans pour par sur avec sans pas plus " +
  "ne se sa son ses leur leurs nous vous ils elles est sont été être avoir fait mais ou donc car the and for with that this from " +
  "are was were have has not you your our their its into they them then than there what which when will would").split(" "));

function stat(label, value) {
  const div = document.createElement("div");
  div.className = "stat";
  const s = document.createElement("span");
  s.textContent = label;
  const b = document.createElement("strong");
  b.textContent = value;
  div.append(s, b);
  return div;
}

function highlight(text, q) {
  const frag = document.createDocumentFragment();
  if (!q) { frag.append(text); return frag; }
  const lower = text.toLowerCase();
  let i = 0;
  for (;;) {
    const at = lower.indexOf(q, i);
    if (at === -1) break;
    frag.append(text.slice(i, at));
    const m = document.createElement("mark");
    m.textContent = text.slice(at, at + q.length);
    frag.append(m);
    i = at + q.length;
  }
  frag.append(text.slice(i));
  return frag;
}

function renderLines(lines) {
  const q = state.q.trim().toLowerCase();
  const box = $("lines");
  box.replaceChildren();
  let shown = 0;
  for (let i = 0; i < lines.length && shown < 1500; i++) {
    if (q && !lines[i].toLowerCase().includes(q)) continue;
    const row = document.createElement("div");
    row.className = "line";
    const n = document.createElement("b");
    n.textContent = i + 1;
    const t = document.createElement("span");
    t.append(highlight(lines[i], q));
    row.append(n, t);
    box.append(row);
    shown += 1;
  }
  if (!shown) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Aucune ligne ne correspond.";
    box.append(p);
  }
}

if (FILE && FILE.kind === "txt") {
  const text = FILE.text;
  const lines = text.split(/\r?\n/);
  const words = text.toLowerCase().match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu) || [];
  const freq = new Map();
  words.forEach((w) => { if (w.length > 2 && !STOP.has(w)) freq.set(w, (freq.get(w) || 0) + 1); });
  const top = [...freq.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12);

  document.title = FILE.name;
  $("title").textContent = FILE.name;
  $("meta").textContent = nf.format(new Set(words).size) + " mots distincts";
  $("stats").append(
    stat("Lignes", nf.format(lines.length)),
    stat("Mots", nf.format(words.length)),
    stat("Caractères", nf.format(text.length)),
    stat("Lecture", nf.format(Math.max(1, Math.round(words.length / 230))) + " min"),
  );
  const max = top.length ? top[0][1] : 1;
  top.forEach(([w, n]) => {
    const li = document.createElement("li");
    const label = document.createElement("span");
    label.className = "w";
    label.textContent = w;
    const bar = document.createElement("span");
    bar.className = "bar";
    bar.style.width = Math.max(4, (n / max) * 100) + "%";
    const count = document.createElement("span");
    count.className = "n";
    count.textContent = n;
    li.append(label, bar, count);
    $("top").append(li);
  });
  $("q").value = state.q;
  $("q").addEventListener("input", () => {
    state.q = $("q").value;
    localStorage.setItem("state", JSON.stringify(state));
    renderLines(lines);
  });
  renderLines(lines);
} else {
  $("app").innerHTML = '<p class="empty">Aucun fichier texte joint : glissez un fichier dans Prism.</p>';
}
</script>
</body>
</html>
