<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouton caméléon</title>
<style>
:root{color-scheme:dark;--accent:#7cc4ff;--bg:#0b0d12;--glass:rgba(255,255,255,.06);--glass-2:rgba(255,255,255,.1);--line:rgba(255,255,255,.14);--text:#f4f6fb;--muted:#9aa3b5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--text);display:flex;padding:clamp(10px,3vw,18px);
background:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--accent) 22%,transparent) 0,transparent 55%),radial-gradient(circle at 90% 100%,#3a1d4a 0,transparent 50%),var(--bg)}
.card{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,3vw,22px);
backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 20px 50px rgba(0,0,0,.45)}
h1{font-size:17px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:12.5px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn{background:var(--glass-2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;transition:background .15s}
.btn:hover{background:rgba(255,255,255,.16)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.5vh,18px);padding-top:10px}
#magic{width:clamp(96px,34vmin,190px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.35);
background:var(--c,#5b8cff);font-size:clamp(13px,2.4vmin,17px);font-weight:600;
box-shadow:0 0 0 6px rgba(255,255,255,.04),0 18px 50px -8px var(--c,#5b8cff),inset 0 2px 0 rgba(255,255,255,.35);
transition:background .3s ease,box-shadow .3s ease,transform .12s ease}
#magic:active{transform:scale(.95)}
.count{font-size:clamp(28px,8vmin,46px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--accent)}
.label{color:var(--muted);font-size:12.5px}
.swatch{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:6px;background:var(--c,#5b8cff)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <h1>Bouton caméléon</h1>
  <p class="sub">Chaque clic change la couleur et incrémente le compteur, mémorisé même après rechargement.</p>
  <div class="stage">
    <button id="magic" type="button" aria-describedby="count-label">Clique-moi</button>
    <div class="count" id="count" aria-live="polite">0</div>
    <div class="label" id="count-label">clics · <span class="swatch"></span><span id="hex">#5B8CFF</span></div>
    <button class="btn" id="reset" type="button">Réinitialiser</button>
  </div>
</main>
<script>
const palette = ["#5B8CFF", "#FF5B8C", "#35D0A5", "#FFB547", "#A66BFF", "#3EC7FF", "#FF7A45"];
const btn = document.getElementById("magic");
const countEl = document.getElementById("count");
const hexEl = document.getElementById("hex");
const state = Object.assign({ clicks: 0 }, JSON.parse(localStorage.getItem("state") || "null"));

function save() {
  localStorage.setItem("state", JSON.stringify(state));
}

function paint(color) {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(color.slice(i, i + 2), 16) / 255);
  const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  document.documentElement.style.setProperty("--c", color);
  btn.style.color = luminance > 0.6 ? "#0b0d12" : "#ffffff";
  hexEl.textContent = color;
}

function render() {
  const color = palette[state.clicks % palette.length];
  countEl.textContent = state.clicks;
  paint(color);
  btn.textContent = state.clicks === 0 ? "Clique-moi" : "Clic n°" + (state.clicks + 1);
  // Bus d'évènements de Prism : les autres widgets du canvas peuvent suivre ce compteur.
  if (window.prism) prism.emit("compteur.change", { clics: state.clicks, couleur: color });
}

btn.addEventListener("click", () => {
  state.clicks += 1;
  save();
  render();
});

document.getElementById("reset").addEventListener("click", () => {
  state.clicks = 0;
  save();
  render();
});

render();
</script>
</body>
</html>
