<!DOCTYPE html>
<html lang="{{lang}}" data-prism-kind="engram" data-prism-nofractal>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
{{tailwind}}
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04040b; color: #fff;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #stage.is-node { cursor: pointer; }
  #stage.is-fusing { animation: fusion-glitch 0.16s steps(2, end) infinite; }
  @keyframes fusion-glitch {
    0% { transform: translate(-3px, 1px) skewX(-1.2deg); filter: hue-rotate(35deg) contrast(1.5) saturate(1.6); }
    50% { transform: translate(4px, -2px) skewX(1.5deg); filter: hue-rotate(-40deg) contrast(1.8) brightness(1.25); }
    100% { transform: none; filter: none; }
  }
  @media (prefers-reduced-motion: reduce) { #stage.is-fusing { animation: none; } }
  #glass { transition: opacity 0.14s ease; }
  .clamp-5 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; }
  .clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  /* Petites cartes (Nexus, carte réduite) : les bulles d'abord, l'en-tête se fait discret. */
  @media (max-width: 520px), (max-height: 340px) { #temperament, #summary { display: none; } }
  @media (max-width: 440px), (max-height: 300px) {
    #domain, #climate, #chat-btn, #legend, footer { display: none !important; }
    #person { font-size: 14px; }
  }
</style>
</head>
<body>
<canvas id="stage" role="img"></canvas>

<header class="pointer-events-none absolute left-4 top-3 z-10 max-w-[58%]">
  <p class="text-[10px] font-semibold uppercase tracking-[0.25em] text-cyan-200/70" data-t="kicker"></p>
  <h1 id="person" class="text-lg font-semibold leading-tight"></h1>
  <p id="domain" class="text-xs text-white/55"></p>
  <p id="temperament" class="clamp-3 mt-1 max-w-md text-[11.5px] italic leading-snug text-rose-100/70 max-[520px]:hidden"></p>
  <p id="summary" class="clamp-3 mt-1 max-w-md text-[11px] leading-snug text-white/40 max-[640px]:hidden"></p>
  <ul id="climate" class="mt-1.5 flex flex-wrap gap-1.5 max-[460px]:hidden" aria-label=""></ul>
  <button id="chat-btn" type="button" class="pointer-events-auto mt-2 inline-flex items-center gap-1.5 rounded-full border border-white/25 bg-white/10 px-3 py-1 text-[11.5px] font-medium text-white shadow-2xl backdrop-blur-md transition hover:bg-white/20">
    <span aria-hidden="true">💬</span><span data-t="chat"></span>
  </button>
</header>

<ul id="legend" class="absolute right-3 top-3 z-10 space-y-0.5 rounded-xl border border-white/10 bg-black/30 px-3 py-2 text-[11px] text-white/70 backdrop-blur-md max-[460px]:hidden"></ul>

<footer class="pointer-events-none absolute inset-x-4 bottom-2 z-10 flex items-end justify-between gap-4 text-[10.5px] leading-snug text-white/40">
  <p data-t="disclaimer"></p>
  <p class="text-right max-[560px]:hidden" data-t="hint"></p>
</footer>

<div id="glass" class="pointer-events-none absolute left-0 top-0 z-20 w-[19rem] max-w-[calc(100%-24px)] overflow-hidden rounded-2xl border border-white/20 bg-white/10 p-4 text-white opacity-0 shadow-2xl backdrop-blur-xl" aria-hidden="true">
  <div class="flex items-center gap-2 text-[10px] font-semibold uppercase tracking-[0.16em]">
    <span data-f="dot" class="h-2 w-2 shrink-0 rounded-full"></span><span data-f="category"></span><span class="text-white/35">·</span><span data-f="type" class="truncate text-white/60"></span>
  </div>
  <h2 data-f="title" class="mt-2 text-[15px] font-semibold leading-snug"></h2>
  <p data-f="date" class="mt-0.5 text-xs font-medium text-amber-200/90"></p>
  <p data-f="emotion" class="mt-1.5 flex items-center gap-1.5 text-[11px] text-white/75"><span data-f="emotionDot" class="h-2 w-2 rounded-full"></span><span data-f="emotionText"></span></p>
  <p data-f="content" class="clamp-5 mt-2 text-[12.5px] leading-relaxed text-white/80"></p>
  <p data-f="origin" class="mt-1 text-[11px] text-fuchsia-100/75"></p>
  <p data-f="impact" class="clamp-3 mt-2 border-l-2 border-amber-300/60 pl-2 text-[12px] leading-snug text-amber-100/85"></p>
  <div data-f="palette" class="mt-3 flex gap-1.5"></div>
  <div data-f="keywords" class="mt-3 flex flex-wrap gap-1"></div>
  <div class="mt-3 rounded-xl border border-white/10 bg-black/25 p-2.5">
    <p class="text-[10px] font-semibold uppercase tracking-[0.16em] text-cyan-200/80" data-t="directive"></p>
    <p data-f="directive" class="clamp-3 mt-1 text-[12px] italic leading-relaxed text-white/75"></p>
  </div>
  <p class="mt-2.5 flex items-start gap-2 text-[11px] leading-snug text-white/55">
    <span data-f="basis" class="shrink-0 rounded-full border border-white/20 px-1.5 py-px text-[10px] text-white/80"></span>
    <span data-f="evidence" class="clamp-3"></span>
  </p>
  <p data-f="action" class="mt-2.5 text-[10.5px] text-cyan-100/70"></p>
</div>

<div id="drop" class="pointer-events-none absolute left-0 top-0 z-30 hidden whitespace-nowrap rounded-full border border-cyan-200/40 bg-black/60 px-3 py-1 text-xs text-white shadow-2xl backdrop-blur-md"></div>

<ul id="nodes-list" class="sr-only"></ul>

<script type="application/json" id="prism-engram">{{engram}}</script>
<script id="engram-physics">
{{physics}}
</script>
<script id="engram-render">
{{render}}
</script>
<!-- Code du fil de rendu (Worker créé depuis ce document, avec la physique et le rendu ci-dessus). -->
<script type="text/plain" id="engram-worker">
// Fil de rendu de la carte (Worker créé depuis ce document) : physique et dessin sur l'OffscreenCanvas confié
// par la page. Messages reçus : init, resize, set, hover, pointer, flash, interactive, budget, visible, buf, pixels ;
// envoyés : alive (démarrage), frame (instantané des positions, fusion, mesures), pixels, error.
(function () {
  "use strict";
  var P = self.PrismEngramPhysics;
  var R = self.PrismEngramRender;
  var sim = null;
  var r = null;
  var running = false;
  var visible = true;
  var interactive = false;
  var broken = false;
  var pool = []; // tampons d'instantanés rendus par la page (réutilisés : aucune allocation en régime établi)
  var frameNo = 0;
  var perfAt = 0;
  var lastFusing = null;
  var pacer = R.createPacer();
  var pixelRequests = []; // lus juste après le dessin d'une image (ensuite, la toile part à l'écran)
  var nextFrame = typeof self.requestAnimationFrame === "function"
    ? function (f) { self.requestAnimationFrame(f); }
    : function (f) { setTimeout(function () { f(performance.now()); }, 16); };

  function frame(now) {
    if (!visible || broken) { running = false; return; }
    if (!pacer.due(now, interactive)) { nextFrame(frame); return; }
    var out;
    try {
      var t0 = performance.now();
      out = r.tick(now, pacer.steps(now));
      pacer.done(now, performance.now() - t0);
      while (pixelRequests.length) {
        var q = pixelRequests.shift();
        self.postMessage({ type: "pixels", id: q.id, values: r.pixels(q.points) });
      }
    } catch (err) {
      broken = true;
      running = false;
      self.postMessage({ type: "error", message: String((err && err.message) || err) });
      return;
    }
    frameNo += 1;
    var perf = null;
    if (now - perfAt > 1000) { perf = r.stats(); perfAt = now; }
    // Instantané à chaque image quand la carte est manipulée, sinon une image sur quatre (la page n'en a besoin
    // que pour le survol, la fiche et les tests).
    if (interactive || out.merged || perf || out.fusing !== lastFusing || frameNo % 4 === 0) {
      lastFusing = out.fusing;
      var buf = sim.snapshot(pool.pop());
      self.postMessage({ type: "frame", buf: buf, fusing: out.fusing, merged: out.merged, perf: perf }, [buf.buffer]);
    }
    nextFrame(frame);
  }

  function start() {
    if (running || !visible || !r || broken) return;
    running = true;
    r.resume();
    pacer.reset();
    nextFrame(frame);
  }

  self.onmessage = function (e) {
    var m = e.data;
    if (m.type === "init") {
      sim = P.createSimulation(m.data, m.sim);
      r = R.createRenderer({
        canvas: m.canvas, ctx: m.canvas.getContext("2d"), sim: sim, data: m.data, reduced: m.reduced,
        makeCanvas: function (w, h) { return new OffscreenCanvas(Math.max(1, w), Math.max(1, h)); }, rng: P.rng, seed: m.sim.seed,
        sprites: true
      });
      r.resize(m.width, m.height, m.dpr);
      r.set(m.view);
      if (m.hover != null) sim.setHover(m.hover);
      if (m.pointer) sim.setPointer(m.pointer[0], m.pointer[1]);
      interactive = Boolean(m.interactive);
      pacer.share(m.share);
      visible = m.visible !== false;
      start();
      return;
    }
    if (!r) return;
    if (m.type === "resize") r.resize(m.width, m.height, m.dpr);
    else if (m.type === "set") r.set(m.patch);
    else if (m.type === "hover") sim.setHover(m.id);
    else if (m.type === "pointer") sim.setPointer(m.x, m.y);
    else if (m.type === "flash") r.flash(m.id);
    else if (m.type === "interactive") interactive = Boolean(m.on);
    else if (m.type === "budget") pacer.share(m.share);
    else if (m.type === "buf") pool.push(m.buf);
    else if (m.type === "pixels") pixelRequests.push({ id: m.id, points: m.points });
    else if (m.type === "visible") {
      visible = Boolean(m.on);
      start();
    }
  };

  self.postMessage({ type: "alive" });
})();
</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("prism-engram").textContent);
  var LANG = document.documentElement.lang === "en" ? "en" : "fr";
  var TEXT = {
    fr: {
      kicker: "Engramme cognitif",
      kickerFusion: "Hyper-Engramme · fusion de deux esprits",

      emotions: {

        peur_primaire: "Peur primaire", biais_cognitif: "Biais cognitif", succes: "Succès", echec: "Échec", tournant: "Tournant"
      },
      basis: { documente: "Documenté", declare: "Déclaré", interpretation: "Interprétation" },
      months: ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."],
      bce: " av. J.-C."
    },
    en: {
      kicker: "Cognitive engram",
      kickerFusion: "Hyper-Engram · fusion of two minds",
      kickerMirror: "Mirror · your creator's Engram",
      origin: "Origin: %s",
      both: "both minds",
      disclaimer: "Interpretive portrait generated by AI from public sources: no quotation, no diagnosis.",
      hint: "Hover: explore · Click: DNA filter · Drop a file or text on a bubble",
      directive: "DNA directive",
      select: "Click: use as DNA filter",
      selected: "DNA filter on: your next request goes through this trait",
      dropOn: "Inject the DNA of “%s”",
      dropMiss: "Drop on a bubble",
      aria: "Cognitive engram of %s: %d bubbles in five categories.",
      climate: "Emotional climate",
      emotion: "Emotional charge: %s",
      chat: "Talk with %s",
      categories: { core: "Core", heart: "Character and emotions", engine: "Operational engines", shadow: "Shadows and biases", artifact: "Chronological artifacts" },
      emotions: {
        joie: "Joy", emerveillement: "Wonder", passion: "Passion", tendresse: "Tenderness", serenite: "Serenity", fierte: "Pride",
        melancolie: "Melancholy", tristesse: "Sadness", colere: "Anger", peur: "Fear", angoisse: "Anxiety", solitude: "Loneliness"
      },
      types: {
        trait: "Character trait", emotion: "Emotion", attachement: "Attachment",
        axiome: "Axiom", algorithme_resolution: "Problem-solving algorithm", empreinte_syntaxique: "Syntactic fingerprint",
        matrice_esthetique: "Aesthetic matrix", methode_travail: "Working method", paradoxe: "Paradox",
        peur_primaire: "Primal fear", biais_cognitif: "Cognitive bias", succes: "Success", echec: "Failure", tournant: "Turning point"
      },
      basis: { documente: "Documented", declare: "Stated", interpretation: "Interpretation" },
      months: ["Jan.", "Feb.", "Mar.", "Apr.", "May", "Jun.", "Jul.", "Aug.", "Sep.", "Oct.", "Nov.", "Dec."],
      bce: " BCE"
    }
  }[LANG];
  var fill = function (s, a, b) { return s.replace("%s", a).replace("%d", b); };

  var P = window.PrismEngramPhysics;
  var R = window.PrismEngramRender;
  var EMOTION_COLOR = R.EMOTION_COLOR;
  var LEGEND = R.LEGEND;
  var colorOf = R.colorOf;
  var rgba = R.rgba;
  var stage = document.getElementById("stage");
  var glass = document.getElementById("glass");
  var dropTag = document.getElementById("drop");
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W = Math.max(1, innerWidth);
  var H = Math.max(1, innerHeight);
  var dpr = Math.min(2, window.devicePixelRatio || 1);

  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  var seed = hash(String(DATA.person || ""));
  // V5 : un Hyper-Engramme joue sa fusion une fois (mémorisé dans le stockage du widget, gardé avec la carte).
  var PARENTS = Array.isArray(DATA.parents) && DATA.parents.length === 2 ? DATA.parents : null;
  var introSeen = false;
  try { introSeen = localStorage.getItem("prism:fusion-seen") === "1"; } catch (e) { /* stockage indisponible */ }
  var simOptions = { width: W, height: H, seed: seed, fusion: Boolean(PARENTS) && !introSeen };
  // La simulation de cette page est soit la vraie (rendu sur ce fil), soit une réplique passive dont les positions
  // viennent des instantanés du Worker : survol, fiche, dépôts et tests la lisent de la même façon.
  var sim = P.createSimulation(DATA, simOptions);
  var byId = {};
  sim.nodes.forEach(function (n) { byId[n.id] = n; });

  // ---------------------------------------------------------------- textes fixes
  document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = TEXT[el.getAttribute("data-t")]; });
  if (PARENTS) document.querySelector('[data-t="kicker"]').textContent = TEXT.kickerFusion;
  // Mode Miroir : votre propre Engramme est un filtre pour vos créations, pas un interlocuteur.
  if (DATA.mirror) {
    document.querySelector('[data-t="kicker"]').textContent = TEXT.kickerMirror;
    document.getElementById("chat-btn").hidden = true;
  }
  document.getElementById("person").textContent = DATA.person || "";
  document.getElementById("domain").textContent = DATA.domain || "";
  document.getElementById("summary").textContent = DATA.summary || "";
  document.getElementById("temperament").textContent = DATA.temperament || "";
  document.querySelector('[data-t="chat"]').textContent = fill(TEXT.chat, DATA.person || "?");
  stage.setAttribute("aria-label", fill(TEXT.aria, DATA.person || "?", sim.nodes.length));
  // Climat émotionnel : puces colorées et pondérées dans l'en-tête.
  var climateList = document.getElementById("climate");
  climateList.setAttribute("aria-label", TEXT.climate);
  (DATA.climate || []).filter(function (c) { return EMOTION_COLOR[c.emotion]; }).forEach(function (c) {
    var li = document.createElement("li");
    li.className = "flex items-center gap-1 rounded-full border border-white/10 bg-black/30 px-2 py-px text-[10.5px] text-white/75";
    var dot = document.createElement("span");
    dot.className = "h-1.5 w-1.5 rounded-full";
    dot.style.background = rgba(EMOTION_COLOR[c.emotion], 1);
    dot.style.boxShadow = "0 0 6px " + rgba(EMOTION_COLOR[c.emotion], 0.9);
    var label = document.createElement("span");
    label.textContent = (TEXT.emotions[c.emotion] || c.emotion) + " " + Math.round(c.weight * 100) + " %";
    li.append(dot, label);
    climateList.append(li);
  });
  var legend = document.getElementById("legend");
  ["core", "heart", "engine", "shadow", "artifact"].forEach(function (cat) {
    var count = sim.nodes.filter(function (n) { return n.category === cat; }).length;
    var li = document.createElement("li");
    li.className = "flex cursor-default items-center gap-2 rounded-md px-1 py-px hover:bg-white/10";
    var dot = document.createElement("span");
    dot.className = "h-2 w-2 shrink-0 rounded-full";
    dot.style.background = rgba(LEGEND[cat], 1);
    dot.style.boxShadow = "0 0 8px " + rgba(LEGEND[cat], 0.9);
    var label = document.createElement("span");
    label.className = "flex-1";
    label.textContent = TEXT.categories[cat];
    var num = document.createElement("span");
    num.className = "tabular-nums text-white/40";
    num.textContent = String(count);
    li.append(dot, label, num);
    li.addEventListener("pointerenter", function () { engine.set({ focus: cat }); });
    li.addEventListener("pointerleave", function () { engine.set({ focus: null }); });
    legend.append(li);
  });
  var list = document.getElementById("nodes-list");
  DATA.nodes.forEach(function (d) {
    var li = document.createElement("li");
    li.textContent = TEXT.categories[d.category] + " — " + d.title + " : " + d.content;
    list.append(li);
  });

  // ---------------------------------------------------------------- moteur de rendu
  // Worker + OffscreenCanvas quand c'est possible : physique et dessin sur un fil séparé, ce fil ne garde que le
  // DOM et le pointeur. Sinon (pas d'OffscreenCanvas, Worker refusé par la page hôte), même code sur ce fil.
  var setSimHover = sim.setHover;
  var setSimPointer = sim.setPointer;
  var fusing = false;
  var interactive = false;
  var share = 0.3; // part d'un cœur accordée au repos (fixée par la page : budget commun des Engrammes)
  var engine = null;

  /** Après chaque image (ou instantané du Worker) : animation de fusion, mémoire de l'introduction, fiche. */
  function afterFrame(out) {
    if (out.fusing !== fusing) {
      fusing = out.fusing;
      stage.classList.toggle("is-fusing", fusing);
    }
    if (out.merged) {
      try { localStorage.setItem("prism:fusion-seen", "1"); } catch (e) { /* stockage indisponible */ }
    }
    placeGlass();
  }

  function inlineEngine() {
    var r = R.createRenderer({
      canvas: stage, ctx: stage.getContext("2d"), sim: sim, data: DATA, reduced: reduced,
      makeCanvas: function () { return document.createElement("canvas"); }, rng: P.rng, seed: seed
    });
    var raf = 0;
    var running = false;
    var perf = null;
    var perfAt = 0;
    var pacer = R.createPacer();
    pacer.share(share);
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (!pacer.due(now, interactive)) return;
      var t0 = performance.now();
      afterFrame(r.tick(now, pacer.steps(now)));
      pacer.done(now, performance.now() - t0);
      if (now - perfAt > 1000) { perf = r.stats(); perfAt = now; }
    }
    r.resize(W, H, dpr);
    return {
      mode: "inline",
      visible: function (on) {
        if (on === running) return;
        running = on;
        cancelAnimationFrame(raf);
        if (on) { r.resume(); pacer.reset(); raf = requestAnimationFrame(frame); }
      },
      resize: function () { r.resize(W, H, dpr); },
      set: r.set,
      flash: r.flash,
      hover: function (id) { setSimHover(id); },
      pointer: function (x, y) { setSimPointer(x, y); },
      interactive: function () {},
      budget: function (value) { pacer.share(value); },
      pixels: function (points) { return Promise.resolve(r.pixels(points)); },
      perf: function () { return perf; }
    };
  }

  function workerEngine(onFail) {
    if (typeof stage.transferControlToOffscreen !== "function" || typeof Worker !== "function" || typeof OffscreenCanvas !== "function") return null;
    var source = ["engram-physics", "engram-render", "engram-worker"].map(function (id) {
      return document.getElementById(id).textContent;
    }).join("\n;\n");
    var url;
    var worker;
    try {
      url = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
      worker = new Worker(url);
    } catch (e) {
      return null;
    }
    var state = "starting"; // starting → running | failed
    var view = {}; // état d'affichage accumulé avant le démarrage, remis au Worker à l'initialisation
    var hoverId = null;
    var pointer = null;
    var perf = null;
    var waiting = {};
    var early = []; // lectures de pixels demandées avant le démarrage du Worker
    var seq = 0;
    var timer = setTimeout(fail, 4000);
    function fail() {
      if (state !== "starting") return;
      state = "failed";
      clearTimeout(timer);
      try { worker.terminate(); } catch (e) { /* déjà arrêté */ }
      URL.revokeObjectURL(url);
      onFail();
      early.forEach(function (q) { engine.pixels(q.points).then(q.resolve); }); // repli : lues sur ce fil
      early = [];
    }
    function ask(points, resolve) {
      var id = ++seq;
      waiting[id] = resolve;
      worker.postMessage({ type: "pixels", id: id, points: points });
    }
    function post(message) {
      if (state === "running") worker.postMessage(message);
    }
    worker.onerror = function (e) {
      if (state === "starting") { e.preventDefault(); fail(); }
    };
    worker.onmessage = function (e) {
      var m = e.data;
      if (m.type === "alive" && state === "starting") {
        // Le Worker tourne (la page hôte l'autorise) : la toile lui est confiée, sans retour possible.
        state = "running";
        clearTimeout(timer);
        URL.revokeObjectURL(url);
        var off = stage.transferControlToOffscreen();
        worker.postMessage({
          type: "init", canvas: off, data: DATA, sim: simOptions, reduced: reduced, width: W, height: H, dpr: dpr,
          view: view, hover: hoverId, pointer: pointer, interactive: interactive, share: share, visible: visibleNow()
        }, [off]);
        early.forEach(function (q) { ask(q.points, q.resolve); });
        early = [];
      } else if (m.type === "frame") {
        sim.sync(m.buf);
        if (m.perf) perf = m.perf;
        afterFrame(m);
        worker.postMessage({ type: "buf", buf: m.buf }, [m.buf.buffer]); // tampon rendu au Worker (réutilisé)
      } else if (m.type === "pixels") {
        var done = waiting[m.id];
        delete waiting[m.id];
        if (done) done(m.values);
      } else if (m.type === "error") {
        console.warn("Engramme : rendu interrompu —", m.message);
      }
    };
    return {
      get mode() { return state === "running" ? "worker" : state; },
      visible: function (on) { post({ type: "visible", on: on }); },
      resize: function () { post({ type: "resize", width: W, height: H, dpr: dpr }); },
      set: function (patch) {
        for (var k in patch) view[k] = patch[k];
        post({ type: "set", patch: patch });
      },
      flash: function (id) { post({ type: "flash", id: id }); },
      hover: function (id) { hoverId = id; setSimHover(id); post({ type: "hover", id: id }); },
      pointer: function (x, y) { pointer = x == null ? null : [x, y]; post({ type: "pointer", x: x, y: y }); },
      interactive: function (on) { post({ type: "interactive", on: on }); },
      budget: function (value) { post({ type: "budget", share: value }); },
      pixels: function (points) {
        return new Promise(function (resolve) {
          if (state === "starting") early.push({ points: points, resolve: resolve });
          else if (state === "running") ask(points, resolve);
          else resolve([]);
        });
      },
      perf: function () { return perf; }
    };
  }

  // Les appels à la simulation passent par le moteur actif (vraie simulation ou Worker).
  sim.setHover = function (id) { engine.hover(id); };
  sim.setPointer = function (x, y) { engine.pointer(x, y); };
  // Pause hors de l'écran (carte défilée, onglet caché) : ni physique ni dessin pour rien.
  var onScreen = true;
  function visibleNow() { return onScreen && !document.hidden; }
  function updateVisible() { engine.visible(visibleNow()); }
  function useInline() { engine = inlineEngine(); engine.visible(visibleNow()); }
  engine = workerEngine(useInline);
  if (!engine) useInline();
  document.addEventListener("visibilitychange", updateVisible);
  if (typeof IntersectionObserver === "function") {
    new IntersectionObserver(function (entries) {
      onScreen = entries[entries.length - 1].isIntersecting;
      updateVisible();
    }).observe(stage);
  }

  function resize() {
    W = Math.max(1, innerWidth);
    H = Math.max(1, innerHeight);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    engine.resize();
  }
  window.addEventListener("resize", resize);

  // ---------------------------------------------------------------- interaction
  var hover = null;   // bulle sous le pointeur
  var pinned = null;  // bulle choisie comme filtre ADN (clic)
  var dropTarget = null;
  var pointerIn = false;
  var traceIds = [];
  var send = function (message) { try { parent.postMessage(message, "*"); } catch (e) { /* hors de Prism */ } };

  /** Instantanés du Worker à chaque image quand la carte est manipulée (survol, fiche, dépôt), sinon plus rares. */
  function syncInteractive() {
    var on = pointerIn || Boolean(pinned) || Boolean(dropTarget);
    if (on !== interactive) {
      interactive = on;
      engine.interactive(on);
    }
  }
  function syncHover() {
    sim.setHover(dropTarget ? dropTarget.id : hover ? hover.id : pinned ? pinned.id : null);
    engine.set({ hover: hover ? hover.id : null, pinned: pinned ? pinned.id : null, drop: dropTarget ? dropTarget.id : null });
    syncInteractive();
  }

  var shadowSoundAt = 0;
  /** V5 · aura : une ombre toute proche du pointeur s'enfuit → la page joue un son grave (si l'aura est active). */
  function shadowFlees(x, y) {
    var now = performance.now();
    if (now - shadowSoundAt < 1200) return;
    for (var i = 0; i < sim.nodes.length; i++) {
      var n = sim.nodes[i];
      if (n.category === "shadow" && Math.hypot(n.x - x, n.y - y) < n.r + 40) {
        shadowSoundAt = now;
        send({ prism: "engram-sound", kind: "shadow" });
        return;
      }
    }
  }

  stage.addEventListener("pointermove", function (e) {
    pointerIn = true;
    sim.setPointer(e.clientX, e.clientY);
    shadowFlees(e.clientX, e.clientY);
    var n = sim.nodeAt(e.clientX, e.clientY, 6);
    if (n !== hover) {
      hover = n;
      stage.classList.toggle("is-node", Boolean(n));
      syncHover();
    }
    syncInteractive();
  });
  stage.addEventListener("pointerleave", function () {
    pointerIn = false;
    hover = null;
    sim.setPointer(null);
    stage.classList.remove("is-node");
    syncHover();
  });
  stage.addEventListener("click", function (e) {
    var n = sim.nodeAt(e.clientX, e.clientY, 6);
    pin(n && n !== pinned ? n : null, true);
  });

  function pin(n, notify) {
    pinned = n || null;
    syncHover();
    if (!notify) return;
    send({ prism: "engram-select", nodeId: pinned ? pinned.id : null });
    if (pinned && window.prism) {
      try {
        window.prism.emit("engramme.noeud", {
          personne: DATA.person, id: pinned.id, titre: pinned.data.title, categorie: pinned.category,
          type: pinned.data.type, directive: pinned.data.directive
        });
      } catch (err) { /* bus absent (fichier exporté) */ }
    }
  }

  // Trace logique d'une réponse : des ronds numérotés, posés un à un sur les bulles qui ont guidé la réponse,
  // reliés par un fil lumineux dans l'ordre du raisonnement ; chacun écrit ce que sa bulle apporte.
  function setTrace(steps) {
    var clean = (Array.isArray(steps) ? steps : []).filter(function (s) { return s && byId[s.id]; }).slice(0, 4)
      .map(function (s) { return { id: s.id, why: String(s.why || "").slice(0, 120) }; });
    traceIds = clean.map(function (s) { return s.id; });
    engine.set({ trace: clean.length ? clean : null });
  }

  window.addEventListener("message", function (e) {
    if (e.source !== parent || !e.data) return;
    if (e.data.prism === "engram-pin") pin(byId[e.data.nodeId] || null, false);
    else if (e.data.prism === "engram-trace") setTrace(e.data.steps);
    else if (e.data.prism === "engram-budget" && typeof e.data.share === "number") {
      share = e.data.share;
      engine.budget(share);
    }
  });

  // « Discuter avec … » : la conversation s'ouvre dans la page (elle seule parle au modèle).
  document.getElementById("chat-btn").addEventListener("click", function () { send({ prism: "engram-chat" }); });

  // « Injection d'ADN » : un fichier ou un texte déposé sur une bulle part vers la page.
  function dropAt(e) {
    var n = sim.nodeAt(e.clientX, e.clientY, 16);
    if (n !== dropTarget) { dropTarget = n; syncHover(); }
    dropTag.classList.remove("hidden");
    dropTag.textContent = n ? fill(TEXT.dropOn, n.data.title) : TEXT.dropMiss;
    var x = Math.min(W - dropTag.offsetWidth / 2 - 8, Math.max(dropTag.offsetWidth / 2 + 8, n ? n.x : e.clientX));
    var y = Math.max(dropTag.offsetHeight + 8, (n ? n.y - n.r : e.clientY) - 10);
    dropTag.style.transform = "translate(" + Math.round(x - dropTag.offsetWidth / 2) + "px," + Math.round(y - dropTag.offsetHeight) + "px)";
    return n;
  }
  function endDrop() { dropTarget = null; dropTag.classList.add("hidden"); syncHover(); }
  window.addEventListener("dragover", function (e) {
    e.preventDefault();
    var n = dropAt(e);
    if (e.dataTransfer) e.dataTransfer.dropEffect = n ? "copy" : "none";
  });
  window.addEventListener("dragleave", function (e) { if (!e.relatedTarget) endDrop(); });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    var n = sim.nodeAt(e.clientX, e.clientY, 16);
    endDrop();
    if (!n || !e.dataTransfer) return;
    var file = e.dataTransfer.files && e.dataTransfer.files[0];
    var text = file ? "" : String(e.dataTransfer.getData("text/plain") || "").slice(0, 12000);
    if (!file && !text.trim()) return;
    engine.flash(n.id);
    send({ prism: "engram-drop", nodeId: n.id, file: file || null, text: text });
  });

  // ---------------------------------------------------------------- fiche « Liquid Glass »
  var field = {};
  glass.querySelectorAll("[data-f]").forEach(function (el) { field[el.getAttribute("data-f")] = el; });
  var shown = null;

  function formatDate(date) {
    if (!date) return "";
    var negative = date.charAt(0) === "-";
    var p = date.replace(/^-/, "").split("-");
    var year = String(parseInt(p[0], 10)) + (negative ? TEXT.bce : "");
    if (p.length === 1) return year;
    var month = TEXT.months[parseInt(p[1], 10) - 1] || "";
    return (p[2] ? parseInt(p[2], 10) + " " : "") + month + " " + year;
  }

  function fillGlass(n) {
    var d = n.data;
    var c = colorOf(n);
    field.dot.style.background = rgba(c, 1);
    field.dot.style.boxShadow = "0 0 10px " + rgba(c, 0.9);
    field.category.textContent = TEXT.categories[d.category];
    field.category.style.color = rgba(c, 0.95);
    field.type.textContent = TEXT.types[d.type] || d.type;
    field.title.textContent = d.title;
    field.date.textContent = formatDate(d.date);
    field.date.hidden = !d.date;
    var origin = PARENTS && Array.isArray(d.sources) ? (d.sources.length === 1 ? PARENTS[d.sources[0] === "a" ? 0 : 1] : TEXT.both) : "";
    field.origin.textContent = origin ? fill(TEXT.origin, origin) : "";
    field.origin.hidden = !origin;
    var em = EMOTION_COLOR[d.emotion];
    field.emotion.hidden = !em;
    if (em) {
      field.emotionDot.style.background = rgba(em, 1);
      field.emotionDot.style.boxShadow = "0 0 8px " + rgba(em, 0.9);
      field.emotionText.textContent = fill(TEXT.emotion, TEXT.emotions[d.emotion]);
    }
    field.content.textContent = d.content;
    field.impact.textContent = d.impact || "";
    field.impact.hidden = !d.impact;
    field.directive.textContent = d.directive;
    field.basis.textContent = TEXT.basis[d.basis] || d.basis;
    field.evidence.textContent = d.evidence || "";
    field.palette.replaceChildren();
    (d.palette || []).forEach(function (hex) {
      var sw = document.createElement("span");
      sw.className = "h-4 w-4 rounded-full border border-white/30";
      sw.style.background = hex;
      sw.title = hex;
      field.palette.append(sw);
    });
    field.palette.hidden = !(d.palette && d.palette.length);
    field.keywords.replaceChildren();
    (d.keywords || []).forEach(function (k) {
      var chip = document.createElement("span");
      chip.className = "rounded-full border border-white/15 bg-white/10 px-2 py-px text-[10.5px] text-white/80";
      chip.textContent = k;
      field.keywords.append(chip);
    });
    field.keywords.hidden = !(d.keywords && d.keywords.length);
  }

  function placeGlass() {
    var n = dropTarget ? null : hover || pinned;
    if (n !== shown) {
      shown = n;
      if (n) fillGlass(n);
      glass.style.opacity = n ? "1" : "0";
    }
    if (!n) return;
    field.action.textContent = n === pinned ? TEXT.selected : TEXT.select;
    var gw = glass.offsetWidth;
    var gh = glass.offsetHeight;
    var gap = n.r + 18;
    var x = n.x + gap + gw <= W - 10 ? n.x + gap : n.x - gap - gw;
    x = Math.max(10, Math.min(W - gw - 10, x));
    var y = Math.max(10, Math.min(H - gh - 10, n.y - gh / 2));
    glass.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y) + "px)";
  }

  // Accès pour les tests de bout en bout et le banc de mesure (lecture seule en pratique : rien d'autre ne s'y fie).
  window.__engram = {
    sim: sim, data: DATA,
    get mode() { return engine.mode; },
    pin: function (id) { pin(byId[id] || null, true); },
    /** Couleurs [r, g, b, a] de la toile aux points CSS donnés (le Worker les lit dans sa toile). */
    pixels: function (points) { return engine.pixels(points); },
    /** Images/s, physique et dessin (ms par image) de la dernière seconde, mesurés sur le fil qui dessine. */
    perf: function () { return engine.perf(); },
    state: function () {
      return { hover: hover && hover.id, pinned: pinned && pinned.id, drop: dropTarget && dropTarget.id, glass: shown && shown.id, pointerIn: pointerIn,
        trace: traceIds.slice(), fusion: sim.fusion, parents: PARENTS, mode: engine.mode };
    }
  };
})();
</script>
</body>
</html>
