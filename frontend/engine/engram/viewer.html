<!DOCTYPE html>
<html lang="{{lang}}" data-prism-kind="engram" data-prism-nofractal>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
{{tailwind}}
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04040b; color: #fff;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #stage.is-node { cursor: pointer; }
  #glass { transition: opacity 0.14s ease; }
  .clamp-5 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; }
  .clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
</style>
</head>
<body>
<canvas id="stage" role="img"></canvas>

<header class="pointer-events-none absolute left-4 top-3 z-10 max-w-[58%]">
  <p class="text-[10px] font-semibold uppercase tracking-[0.25em] text-cyan-200/70" data-t="kicker"></p>
  <h1 id="person" class="text-lg font-semibold leading-tight"></h1>
  <p id="domain" class="text-xs text-white/55"></p>
  <p id="summary" class="clamp-3 mt-1 max-w-md text-[11px] leading-snug text-white/40 max-[640px]:hidden"></p>
</header>

<ul id="legend" class="absolute right-3 top-3 z-10 space-y-0.5 rounded-xl border border-white/10 bg-black/30 px-3 py-2 text-[11px] text-white/70 backdrop-blur-md max-[460px]:hidden"></ul>

<footer class="pointer-events-none absolute inset-x-4 bottom-2 z-10 flex items-end justify-between gap-4 text-[10.5px] leading-snug text-white/40">
  <p data-t="disclaimer"></p>
  <p class="text-right max-[560px]:hidden" data-t="hint"></p>
</footer>

<div id="glass" class="pointer-events-none absolute left-0 top-0 z-20 w-[19rem] max-w-[calc(100%-24px)] overflow-hidden rounded-2xl border border-white/20 bg-white/10 p-4 text-white opacity-0 shadow-2xl backdrop-blur-xl" aria-hidden="true">
  <div class="flex items-center gap-2 text-[10px] font-semibold uppercase tracking-[0.16em]">
    <span data-f="dot" class="h-2 w-2 shrink-0 rounded-full"></span><span data-f="category"></span><span class="text-white/35">·</span><span data-f="type" class="truncate text-white/60"></span>
  </div>
  <h2 data-f="title" class="mt-2 text-[15px] font-semibold leading-snug"></h2>
  <p data-f="date" class="mt-0.5 text-xs font-medium text-amber-200/90"></p>
  <p data-f="content" class="clamp-5 mt-2 text-[12.5px] leading-relaxed text-white/80"></p>
  <p data-f="impact" class="clamp-3 mt-2 border-l-2 border-amber-300/60 pl-2 text-[12px] leading-snug text-amber-100/85"></p>
  <div data-f="palette" class="mt-3 flex gap-1.5"></div>
  <div data-f="keywords" class="mt-3 flex flex-wrap gap-1"></div>
  <div class="mt-3 rounded-xl border border-white/10 bg-black/25 p-2.5">
    <p class="text-[10px] font-semibold uppercase tracking-[0.16em] text-cyan-200/80" data-t="directive"></p>
    <p data-f="directive" class="clamp-3 mt-1 text-[12px] italic leading-relaxed text-white/75"></p>
  </div>
  <p class="mt-2.5 flex items-start gap-2 text-[11px] leading-snug text-white/55">
    <span data-f="basis" class="shrink-0 rounded-full border border-white/20 px-1.5 py-px text-[10px] text-white/80"></span>
    <span data-f="evidence" class="clamp-3"></span>
  </p>
  <p data-f="action" class="mt-2.5 text-[10.5px] text-cyan-100/70"></p>
</div>

<div id="drop" class="pointer-events-none absolute left-0 top-0 z-30 hidden whitespace-nowrap rounded-full border border-cyan-200/40 bg-black/60 px-3 py-1 text-xs text-white shadow-2xl backdrop-blur-md"></div>

<ul id="nodes-list" class="sr-only"></ul>

<script type="application/json" id="prism-engram">{{engram}}</script>
<script>
{{physics}}
</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("prism-engram").textContent);
  var LANG = document.documentElement.lang === "en" ? "en" : "fr";
  var TEXT = {
    fr: {
      kicker: "Engramme cognitif",
      disclaimer: "Portrait interprétatif généré par IA d'après des sources publiques : ni citation, ni diagnostic.",
      hint: "Survol : explorer · Clic : filtre ADN · Déposez un fichier ou un texte sur une bulle",
      directive: "Directive ADN",
      select: "Clic : utiliser comme filtre ADN",
      selected: "Filtre ADN actif : votre prochaine demande passera par ce trait",
      dropOn: "Injecter l'ADN de « %s »",
      dropMiss: "Déposez sur une bulle",
      aria: "Engramme cognitif de %s : %d bulles en quatre catégories.",
      categories: { core: "Noyau", engine: "Moteurs opérationnels", shadow: "Ombres et biais", artifact: "Artefacts chronologiques" },
      types: {
        axiome: "Axiome", algorithme_resolution: "Algorithme de résolution", empreinte_syntaxique: "Empreinte syntaxique",
        matrice_esthetique: "Matrice esthétique", methode_travail: "Méthode de travail", paradoxe: "Paradoxe",
        peur_primaire: "Peur primaire", biais_cognitif: "Biais cognitif", succes: "Succès", echec: "Échec", tournant: "Tournant"
      },
      basis: { documente: "Documenté", declare: "Déclaré", interpretation: "Interprétation" },
      months: ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."],
      bce: " av. J.-C."
    },
    en: {
      kicker: "Cognitive engram",
      disclaimer: "Interpretive portrait generated by AI from public sources: no quotation, no diagnosis.",
      hint: "Hover: explore · Click: DNA filter · Drop a file or text on a bubble",
      directive: "DNA directive",
      select: "Click: use as DNA filter",
      selected: "DNA filter on: your next request goes through this trait",
      dropOn: "Inject the DNA of “%s”",
      dropMiss: "Drop on a bubble",
      aria: "Cognitive engram of %s: %d bubbles in four categories.",
      categories: { core: "Core", engine: "Operational engines", shadow: "Shadows and biases", artifact: "Chronological artifacts" },
      types: {
        axiome: "Axiom", algorithme_resolution: "Problem-solving algorithm", empreinte_syntaxique: "Syntactic fingerprint",
        matrice_esthetique: "Aesthetic matrix", methode_travail: "Working method", paradoxe: "Paradox",
        peur_primaire: "Primal fear", biais_cognitif: "Cognitive bias", succes: "Success", echec: "Failure", tournant: "Turning point"
      },
      basis: { documente: "Documented", declare: "Stated", interpretation: "Interpretation" },
      months: ["Jan.", "Feb.", "Mar.", "Apr.", "May", "Jun.", "Jul.", "Aug.", "Sep.", "Oct.", "Nov.", "Dec."],
      bce: " BCE"
    }
  }[LANG];
  var fill = function (s, a, b) { return s.replace("%s", a).replace("%d", b); };

  // Couleurs [r, g, b] par catégorie (et par type pour les ombres et les artefacts).
  var COLOR = {
    core: [214, 232, 255], engine: [34, 211, 238],
    paradoxe: [168, 85, 247], peur_primaire: [244, 63, 94], biais_cognitif: [139, 92, 246],
    succes: [251, 191, 36], echec: [251, 146, 60], tournant: [253, 230, 138]
  };
  var colorOf = function (n) { return COLOR[n.category === "core" || n.category === "engine" ? n.category : n.data.type] || COLOR.engine; };
  var rgba = function (c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; };
  var LEGEND = { core: [255, 255, 255], engine: COLOR.engine, shadow: [192, 38, 211], artifact: COLOR.succes };

  var P = window.PrismEngramPhysics;
  var stage = document.getElementById("stage");
  var ctx = stage.getContext("2d");
  var glass = document.getElementById("glass");
  var dropTag = document.getElementById("drop");
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W = Math.max(1, innerWidth);
  var H = Math.max(1, innerHeight);
  var dpr = 1;

  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  var seed = hash(String(DATA.person || ""));
  var sim = P.createSimulation(DATA, { width: W, height: H, seed: seed });
  var byId = {};
  var neighbours = {};
  sim.nodes.forEach(function (n) { byId[n.id] = n; neighbours[n.id] = {}; });
  sim.links.forEach(function (l) { neighbours[l.a.id][l.b.id] = true; neighbours[l.b.id][l.a.id] = true; });
  // État d'affichage propre à chaque bulle : traînée (artefacts), glitch (ombres).
  sim.nodes.forEach(function (n) {
    n.trail = [];
    n.glitchAt = 1 + Math.random() * 4;
    n.glitchUntil = 0;
  });

  // ---------------------------------------------------------------- textes fixes
  document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = TEXT[el.getAttribute("data-t")]; });
  document.getElementById("person").textContent = DATA.person || "";
  document.getElementById("domain").textContent = DATA.domain || "";
  document.getElementById("summary").textContent = DATA.summary || "";
  stage.setAttribute("aria-label", fill(TEXT.aria, DATA.person || "?", sim.nodes.length));
  var legend = document.getElementById("legend");
  var focusCategory = null;
  ["core", "engine", "shadow", "artifact"].forEach(function (cat) {
    var count = sim.nodes.filter(function (n) { return n.category === cat; }).length;
    var li = document.createElement("li");
    li.className = "flex cursor-default items-center gap-2 rounded-md px-1 py-px hover:bg-white/10";
    var dot = document.createElement("span");
    dot.className = "h-2 w-2 shrink-0 rounded-full";
    dot.style.background = rgba(LEGEND[cat], 1);
    dot.style.boxShadow = "0 0 8px " + rgba(LEGEND[cat], 0.9);
    var label = document.createElement("span");
    label.className = "flex-1";
    label.textContent = TEXT.categories[cat];
    var num = document.createElement("span");
    num.className = "tabular-nums text-white/40";
    num.textContent = String(count);
    li.append(dot, label, num);
    li.addEventListener("pointerenter", function () { focusCategory = cat; });
    li.addEventListener("pointerleave", function () { focusCategory = null; });
    legend.append(li);
  });
  var list = document.getElementById("nodes-list");
  DATA.nodes.forEach(function (d) {
    var li = document.createElement("li");
    li.textContent = TEXT.categories[d.category] + " — " + d.title + " : " + d.content;
    list.append(li);
  });

  // ---------------------------------------------------------------- ciel (pré-rendu)
  var sky = document.createElement("canvas");
  var stars = [];
  (function () {
    var r = P.rng(seed ^ 0x9e3779b9);
    for (var i = 0; i < 170; i++) stars.push({ x: r(), y: r(), s: 0.25 + r() * r() * 1.3, a: 0.15 + r() * 0.6 });
  })();

  function paintSky() {
    sky.width = Math.round(W * dpr);
    sky.height = Math.round(H * dpr);
    var g = sky.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    var bg = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.hypot(W, H) / 2);
    bg.addColorStop(0, "#0c1024");
    bg.addColorStop(0.55, "#070814");
    bg.addColorStop(1, "#020206");
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);
    stars.forEach(function (s) {
      g.fillStyle = "rgba(220,230,255," + s.a + ")";
      g.beginPath();
      g.arc(s.x * W, s.y * H, s.s, 0, Math.PI * 2);
      g.fill();
    });
    // Anneaux des catégories : l'architecture de l'esprit, à peine visible.
    var a = Math.max(40, W / 2 - 26);
    var b = Math.max(40, H / 2 - 26);
    [[0.44, "rgba(34,211,238,0.07)"], [0.68, "rgba(168,85,247,0.06)"], [0.92, "rgba(251,191,36,0.05)"]].forEach(function (ring) {
      g.strokeStyle = ring[1];
      g.lineWidth = 1;
      g.setLineDash([2, 6]);
      g.beginPath();
      g.ellipse(W / 2, H / 2, a * ring[0], b * ring[0], 0, 0, Math.PI * 2);
      g.stroke();
    });
  }

  function resize() {
    var w = Math.max(1, innerWidth);
    var h = Math.max(1, innerHeight);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    stage.width = Math.round(w * dpr);
    stage.height = Math.round(h * dpr);
    if (w !== W || h !== H) sim.resize(w, h);
    W = w;
    H = h;
    paintSky();
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------------------------------------------------------------- interaction
  var hover = null;   // bulle sous le pointeur
  var pinned = null;  // bulle choisie comme filtre ADN (clic)
  var dropTarget = null;
  var pointerIn = false;
  var send = function (message) { try { parent.postMessage(message, "*"); } catch (e) { /* hors de Prism */ } };

  function syncHover() { sim.setHover(dropTarget ? dropTarget.id : hover ? hover.id : pinned ? pinned.id : null); }

  stage.addEventListener("pointermove", function (e) {
    pointerIn = true;
    sim.setPointer(e.clientX, e.clientY);
    var n = sim.nodeAt(e.clientX, e.clientY, 6);
    if (n !== hover) {
      hover = n;
      stage.classList.toggle("is-node", Boolean(n));
      syncHover();
    }
  });
  stage.addEventListener("pointerleave", function () {
    pointerIn = false;
    hover = null;
    sim.setPointer(null);
    stage.classList.remove("is-node");
    syncHover();
  });
  stage.addEventListener("click", function (e) {
    var n = sim.nodeAt(e.clientX, e.clientY, 6);
    pin(n && n !== pinned ? n : null, true);
  });

  function pin(n, notify) {
    pinned = n || null;
    syncHover();
    if (!notify) return;
    send({ prism: "engram-select", nodeId: pinned ? pinned.id : null });
    if (pinned && window.prism) {
      try {
        window.prism.emit("engramme.noeud", {
          personne: DATA.person, id: pinned.id, titre: pinned.data.title, categorie: pinned.category,
          type: pinned.data.type, directive: pinned.data.directive
        });
      } catch (err) { /* bus absent (fichier exporté) */ }
    }
  }

  window.addEventListener("message", function (e) {
    if (e.source !== parent || !e.data || e.data.prism !== "engram-pin") return;
    pin(byId[e.data.nodeId] || null, false);
  });

  // « Injection d'ADN » : un fichier ou un texte déposé sur une bulle part vers la page.
  function dropAt(e) {
    var n = sim.nodeAt(e.clientX, e.clientY, 16);
    if (n !== dropTarget) { dropTarget = n; syncHover(); }
    dropTag.classList.remove("hidden");
    dropTag.textContent = n ? fill(TEXT.dropOn, n.data.title) : TEXT.dropMiss;
    var x = Math.min(W - dropTag.offsetWidth / 2 - 8, Math.max(dropTag.offsetWidth / 2 + 8, n ? n.x : e.clientX));
    var y = Math.max(dropTag.offsetHeight + 8, (n ? n.y - n.r : e.clientY) - 10);
    dropTag.style.transform = "translate(" + Math.round(x - dropTag.offsetWidth / 2) + "px," + Math.round(y - dropTag.offsetHeight) + "px)";
    return n;
  }
  function endDrop() { dropTarget = null; dropTag.classList.add("hidden"); syncHover(); }
  window.addEventListener("dragover", function (e) {
    e.preventDefault();
    var n = dropAt(e);
    if (e.dataTransfer) e.dataTransfer.dropEffect = n ? "copy" : "none";
  });
  window.addEventListener("dragleave", function (e) { if (!e.relatedTarget) endDrop(); });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    var n = sim.nodeAt(e.clientX, e.clientY, 16);
    endDrop();
    if (!n || !e.dataTransfer) return;
    var file = e.dataTransfer.files && e.dataTransfer.files[0];
    var text = file ? "" : String(e.dataTransfer.getData("text/plain") || "").slice(0, 12000);
    if (!file && !text.trim()) return;
    n.flash = performance.now();
    send({ prism: "engram-drop", nodeId: n.id, file: file || null, text: text });
  });

  // ---------------------------------------------------------------- fiche « Liquid Glass »
  var field = {};
  glass.querySelectorAll("[data-f]").forEach(function (el) { field[el.getAttribute("data-f")] = el; });
  var shown = null;

  function formatDate(date) {
    if (!date) return "";
    var negative = date.charAt(0) === "-";
    var p = date.replace(/^-/, "").split("-");
    var year = String(parseInt(p[0], 10)) + (negative ? TEXT.bce : "");
    if (p.length === 1) return year;
    var month = TEXT.months[parseInt(p[1], 10) - 1] || "";
    return (p[2] ? parseInt(p[2], 10) + " " : "") + month + " " + year;
  }

  function fillGlass(n) {
    var d = n.data;
    var c = colorOf(n);
    field.dot.style.background = rgba(c, 1);
    field.dot.style.boxShadow = "0 0 10px " + rgba(c, 0.9);
    field.category.textContent = TEXT.categories[d.category];
    field.category.style.color = rgba(c, 0.95);
    field.type.textContent = TEXT.types[d.type] || d.type;
    field.title.textContent = d.title;
    field.date.textContent = formatDate(d.date);
    field.date.hidden = !d.date;
    field.content.textContent = d.content;
    field.impact.textContent = d.impact || "";
    field.impact.hidden = !d.impact;
    field.directive.textContent = d.directive;
    field.basis.textContent = TEXT.basis[d.basis] || d.basis;
    field.evidence.textContent = d.evidence || "";
    field.palette.replaceChildren();
    (d.palette || []).forEach(function (hex) {
      var sw = document.createElement("span");
      sw.className = "h-4 w-4 rounded-full border border-white/30";
      sw.style.background = hex;
      sw.title = hex;
      field.palette.append(sw);
    });
    field.palette.hidden = !(d.palette && d.palette.length);
    field.keywords.replaceChildren();
    (d.keywords || []).forEach(function (k) {
      var chip = document.createElement("span");
      chip.className = "rounded-full border border-white/15 bg-white/10 px-2 py-px text-[10.5px] text-white/80";
      chip.textContent = k;
      field.keywords.append(chip);
    });
    field.keywords.hidden = !(d.keywords && d.keywords.length);
  }

  function placeGlass() {
    var n = dropTarget ? null : hover || pinned;
    if (n !== shown) {
      shown = n;
      if (n) fillGlass(n);
      glass.style.opacity = n ? "1" : "0";
    }
    if (!n) return;
    field.action.textContent = n === pinned ? TEXT.selected : TEXT.select;
    var gw = glass.offsetWidth;
    var gh = glass.offsetHeight;
    var gap = n.r + 18;
    var x = n.x + gap + gw <= W - 10 ? n.x + gap : n.x - gap - gw;
    x = Math.max(10, Math.min(W - gw - 10, x));
    var y = Math.max(10, Math.min(H - gh - 10, n.y - gh / 2));
    glass.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y) + "px)";
  }

  // ---------------------------------------------------------------- rendu
  function glow(x, y, radius, c, alpha) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, radius);
    g.addColorStop(0, rgba(c, alpha));
    g.addColorStop(0.4, rgba(c, alpha * 0.35));
    g.addColorStop(1, rgba(c, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function focusAlpha(n) {
    if (focusCategory) return n.category === focusCategory ? 1 : 0.18;
    var f = hover || pinned;
    if (!f || f === n) return 1;
    return neighbours[f.id][n.id] ? 1 : 0.42;
  }

  var LINKS = {
    forge: { c: [255, 255, 255], a: 0.2, w: 1.1, dash: null },
    nourrit: { c: [34, 211, 238], a: 0.3, w: 1.3, dash: null },
    contredit: { c: [244, 63, 94], a: 0.35, w: 1.1, dash: [4, 4] }
  };

  function drawLinks() {
    var f = hover || pinned;
    sim.links.forEach(function (l) {
      var a = l.a;
      var b = l.b;
      var lit = f && (a === f || b === f);
      var fade = Math.min(focusAlpha(a), focusAlpha(b));
      ctx.setLineDash([]);
      if (l.kind === "core") {
        if (b.category === "engine") {
          var g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
          g.addColorStop(0, "rgba(255,255,255," + (lit ? 0.7 : 0.26) * fade + ")");
          g.addColorStop(1, "rgba(34,211,238," + (lit ? 0.9 : 0.38) * fade + ")");
          ctx.strokeStyle = g;
          ctx.lineWidth = lit ? 3.4 : 2.4;
        } else if (b.category === "shadow") {
          ctx.strokeStyle = rgba(colorOf(b), (lit ? 0.5 : 0.1) * fade);
          ctx.lineWidth = 0.8;
          ctx.setLineDash([3, 5]);
        } else {
          if (!lit) return;
          ctx.strokeStyle = rgba(COLOR.succes, 0.35);
          ctx.lineWidth = 0.6;
        }
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        return;
      }
      var s = LINKS[l.kind] || LINKS.forge;
      var dx = b.x - a.x;
      var dy = b.y - a.y;
      // Liens thématiques : légère courbe, pour se distinguer des rayons du noyau.
      var mx = (a.x + b.x) / 2 - dy * 0.14;
      var my = (a.y + b.y) / 2 + dx * 0.14;
      ctx.strokeStyle = rgba(s.c, Math.min(0.95, s.a * (lit ? 2.6 : 1)) * fade);
      ctx.lineWidth = s.w + (lit ? 0.7 : 0);
      if (s.dash) ctx.setLineDash(s.dash);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(mx, my, b.x, b.y);
      ctx.stroke();
    });
    ctx.setLineDash([]);
  }

  function drawCore(n, t, alpha) {
    var r = n.r * sim.pulseOf(n);
    ctx.globalCompositeOperation = "lighter";
    glow(n.x, n.y, r * 3.4, [150, 190, 255], 0.3 * alpha);
    glow(n.x, n.y, r * 1.9, [235, 245, 255], 0.35 * alpha);
    ctx.globalCompositeOperation = "source-over";
    var g = ctx.createRadialGradient(n.x - r * 0.3, n.y - r * 0.35, r * 0.1, n.x, n.y, r);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.6, "#e0ecff");
    g.addColorStop(1, "#9cc2ff");
    ctx.globalAlpha = alpha;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.45)";
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 7]);
    ctx.beginPath();
    ctx.ellipse(n.x, n.y, r * 1.45, r * 1.45, reduced ? 0 : t * 0.25, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  function drawEngine(n, alpha) {
    var r = n.r * sim.pulseOf(n);
    ctx.globalCompositeOperation = "lighter";
    glow(n.x, n.y, r * 2.7, COLOR.engine, 0.32 * alpha);
    ctx.globalCompositeOperation = "source-over";
    var g = ctx.createRadialGradient(n.x - r * 0.35, n.y - r * 0.4, r * 0.1, n.x, n.y, r);
    g.addColorStop(0, "rgba(236,254,255," + alpha + ")");
    g.addColorStop(0.55, "rgba(34,211,238," + alpha + ")");
    g.addColorStop(1, "rgba(14,116,144," + alpha + ")");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(165,243,252," + 0.85 * alpha + ")";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawShadow(n, t, alpha) {
    var c = colorOf(n);
    var pulse = sim.pulseOf(n);
    var r = n.r * pulse;
    var glitching = !reduced && t < n.glitchUntil;
    ctx.globalCompositeOperation = "lighter";
    glow(n.x, n.y, r * 2.5, c, (0.18 + 0.2 * (pulse - 0.86) / 0.28) * alpha);
    if (glitching) {
      // Aberration chromatique : copies décalées rouge et cyan.
      ctx.strokeStyle = "rgba(255,40,90," + 0.75 * alpha + ")";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(n.x - 3, n.y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(40,240,255," + 0.6 * alpha + ")";
      ctx.beginPath();
      ctx.arc(n.x + 3, n.y + 1, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
    var g = ctx.createRadialGradient(n.x, n.y, r * 0.15, n.x, n.y, r);
    g.addColorStop(0, "rgba(6,2,12," + alpha + ")");
    g.addColorStop(0.7, rgba([Math.round(c[0] * 0.35), Math.round(c[1] * 0.2), Math.round(c[2] * 0.4)], 0.95 * alpha));
    g.addColorStop(1, rgba(c, 0.9 * alpha));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rgba(c, alpha);
    ctx.lineWidth = 1.3;
    ctx.stroke();
  }

  function drawArtifact(n, alpha) {
    var c = colorOf(n);
    var trail = n.trail;
    if (trail.length > 1) {
      for (var i = 1; i < trail.length; i++) {
        ctx.strokeStyle = rgba(c, (i / trail.length) * 0.4 * alpha);
        ctx.lineWidth = n.r * 0.9 * (i / trail.length);
        ctx.beginPath();
        ctx.moveTo(trail[i - 1][0], trail[i - 1][1]);
        ctx.lineTo(trail[i][0], trail[i][1]);
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = "lighter";
    glow(n.x, n.y, n.r * 3.4, c, 0.5 * alpha);
    ctx.globalCompositeOperation = "source-over";
    var g = ctx.createRadialGradient(n.x - n.r * 0.3, n.y - n.r * 0.3, 0, n.x, n.y, n.r);
    g.addColorStop(0, "rgba(255,251,235," + alpha + ")");
    g.addColorStop(1, rgba(c, alpha));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fill();
  }

  /** Glitch des ombres : tranches horizontales du rendu décalées (copie de la toile sur elle-même). */
  function glitchSlices(n) {
    var r = n.r * 1.9;
    for (var k = 0; k < 3; k++) {
      var y = n.y - r + Math.random() * r * 2;
      var h = 1.5 + Math.random() * 4;
      var x = n.x - r;
      var off = (Math.random() - 0.5) * 16;
      ctx.drawImage(stage, x * dpr, y * dpr, r * 2 * dpr, h * dpr, x + off, y, r * 2, h);
    }
  }

  var RANK = { core: 0, engine: 1, artifact: 2, shadow: 3 };
  var LABEL_ORDER = sim.nodes.slice().sort(function (a, b) {
    return RANK[a.category] - RANK[b.category] || (b.data.intensity || 0) - (a.data.intensity || 0);
  });

  /** Libellé détouré ; placed : rectangles déjà posés (un chevauchement l'omet). */
  function label(textValue, x, y, size, color, weight, placed) {
    ctx.font = (weight || 500) + " " + size + "px Inter, ui-sans-serif, system-ui, sans-serif";
    if (placed) {
      var half = ctx.measureText(textValue).width / 2 + 3;
      var box = [x - half, y - 1, x + half, y + size + 2];
      for (var i = 0; i < placed.length; i++) {
        var p = placed[i];
        if (box[0] < p[2] && box[2] > p[0] && box[1] < p[3] && box[3] > p[1]) return;
      }
      placed.push(box);
    }
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(2,2,8,0.75)";
    ctx.strokeText(textValue, x, y);
    ctx.fillStyle = color;
    ctx.fillText(textValue, x, y);
  }
  var short = function (s, max) { return s.length > max ? s.slice(0, max - 1) + "…" : s; };

  function drawRing(n, t, color, extra) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.setLineDash([5, 5]);
    ctx.lineDashOffset = reduced ? 0 : -t * 18;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r + extra, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
  }

  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(sky, 0, 0, W, H);
    var core = null;
    sim.nodes.forEach(function (n) { if (n.category === "core") core = n; });
    if (core) {
      ctx.globalCompositeOperation = "lighter";
      glow(core.x, core.y, Math.min(W, H) * 0.5, [70, 110, 255], 0.09);
      ctx.globalCompositeOperation = "source-over";
    }
    drawLinks();
    var order = ["artifact", "shadow", "engine", "core"];
    var glitching = [];
    order.forEach(function (cat) {
      sim.nodes.forEach(function (n) {
        if (n.category !== cat) return;
        var alpha = focusAlpha(n);
        if (cat === "core") drawCore(n, t, alpha);
        else if (cat === "engine") drawEngine(n, alpha);
        else if (cat === "shadow") {
          drawShadow(n, t, alpha);
          if (!reduced && t < n.glitchUntil) glitching.push(n);
        } else drawArtifact(n, alpha);
      });
    });
    glitching.forEach(glitchSlices);
    // Libellés : noyau, puis moteurs (du plus intense au moins intense, si la carte est assez grande),
    // puis années des artefacts ; un libellé qui en chevaucherait un autre déjà posé est omis.
    var roomy = W >= 560 && H >= 400;
    var placed = [];
    LABEL_ORDER.forEach(function (n) {
      var a = focusAlpha(n);
      if (n.category === "core") label(short(n.data.title, 34), n.x, n.y + n.r * 1.55 + 4, 12.5, "rgba(255,255,255," + 0.92 * a + ")", 600, placed);
      else if (n.category === "engine" && roomy) label(short(n.data.title, 24), n.x, n.y + n.r + 5, 10.5, "rgba(207,250,254," + 0.8 * a + ")", 500, placed);
      else if (n.category === "artifact" && W >= 640 && n.data.date) {
        var year = n.data.date.charAt(0) === "-" ? n.data.date.split("-")[1] : n.data.date.split("-")[0];
        label(year, n.x, n.y + n.r + 3, 9, "rgba(253,230,138," + 0.6 * a + ")", 500, placed);
      }
    });
    if (pinned) drawRing(pinned, t, "rgba(255,255,255,0.85)", 7);
    if (dropTarget) {
      var beat = 0.5 + 0.5 * Math.sin(t * 8);
      drawRing(dropTarget, t, "rgba(125,249,255," + (0.6 + 0.4 * beat) + ")", 9 + beat * 4);
    }
    sim.nodes.forEach(function (n) {
      if (!n.flash) return;
      var age = (performance.now() - n.flash) / 700;
      if (age >= 1) { n.flash = 0; return; }
      ctx.strokeStyle = "rgba(125,249,255," + (1 - age) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 6 + age * 40, 0, Math.PI * 2);
      ctx.stroke();
    });
  }

  // ---------------------------------------------------------------- boucle
  var last = performance.now();
  var raf = 0;
  function frame(now) {
    var dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    sim.advance(reduced ? dt * 0.35 : dt);
    var t = now / 1000;
    sim.nodes.forEach(function (n) {
      if (n.category === "artifact") {
        n.trail.push([n.x, n.y]);
        if (n.trail.length > 12) n.trail.shift();
      } else if (n.category === "shadow" && t >= n.glitchAt) {
        n.glitchUntil = t + 0.08 + Math.random() * 0.2;
        n.glitchAt = t + 1.5 + Math.random() * 4.5;
      }
    });
    draw(t);
    placeGlass();
    raf = requestAnimationFrame(frame);
  }
  document.addEventListener("visibilitychange", function () {
    cancelAnimationFrame(raf);
    if (document.hidden) return;
    last = performance.now();
    raf = requestAnimationFrame(frame);
  });
  raf = requestAnimationFrame(frame);

  // Accès pour les tests de bout en bout (lecture seule en pratique : rien d'autre ne s'y fie).
  window.__engram = { sim: sim, data: DATA, pin: function (id) { pin(byId[id] || null, true); }, state: function () {
    return { hover: hover && hover.id, pinned: pinned && pinned.id, drop: dropTarget && dropTarget.id, glass: shown && shown.id, pointerIn: pointerIn };
  } };
})();
</script>
</body>
</html>
